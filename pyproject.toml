[project]
name = "pitwall"
version = "0.1.0"
description = "Batch data pipeline and dashboard for Formula 1 race data from OpenF1."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "pyyaml>=6.0",
]

[project.scripts]
pitwall = "pitwall.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "poethepoet>=0.49.0",
    "pre-commit>=4",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.14",
    "types-pyyaml>=6.0.12.20261030",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "DTZ"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: slower tests that start processes or touch real files"]

[tool.coverage.run]
source = ["pitwall"]
branch = true
# Entry shim only; the integration test runs it in a subprocess.
omit = ["*/pitwall/__main__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.poe.tasks]
lint = { sequence = [{ cmd = "ruff check ." }, { cmd = "ruff format --check ." }], help = "Lint and check formatting" }
format = { sequence = [{ cmd = "ruff check --fix ." }, { cmd = "ruff format ." }], help = "Auto-format and apply safe fixes" }
typecheck = { cmd = "mypy", help = "Strict type check" }
test = { cmd = "pytest --cov", help = "All tests with the coverage gate" }
test-unit = { cmd = "pytest -m 'not integration'", help = "Quick unit tests" }
check = { sequence = ["lint", "typecheck", "test"], help = "Everything CI runs; must pass before a PR" }
